<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Huntress</title>
<style>
  :root {
    --teal: #0d6b7a;
    --gold: #e8b93f;
    --red: #d8482f;
    --cream: #faf6ec;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--teal);
    overflow: hidden;
  }
  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* Dedicated logo band -- its own space, never overlapping the media below */
  .logo-band {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px 20px;
    background: var(--teal);
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 14px 14px;
    position: relative;
    z-index: 2;
  }
  .wordmark {
    max-width: 360px;
    width: 46%;
    min-width: 200px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
  }
  .status-link {
    position: absolute;
    top: 50%;
    right: 18px;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--cream);
    text-decoration: none;
    background: rgba(0,0,0,0.25);
    padding: 6px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.4);
  }

  /* Media band -- the animation, filling all remaining space below the logo */
  .media-band {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .media-band video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }
  .hero-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 24px 20px 36px 20px;
    z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  }
  .cta-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--ink);
    background: var(--gold);
    border: 4px solid var(--ink);
    border-radius: 16px;
    padding: 16px 28px;
    min-width: 220px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-align: center;
  }
  .cta-btn:hover {
    transform: translate(-2px, -4px);
    box-shadow: 8px 10px 0 rgba(0,0,0,0.4);
  }
  .cta-btn.red {
    background: var(--red);
    color: var(--cream);
  }
  .cta-btn .cta-title {
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cta-btn .cta-sub {
    font-size: 12px;
    margin-top: 5px;
    font-weight: 500;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="page">

  <div class="logo-band">
    <img class="wordmark" src="{{ url_for('static', filename='logo-wordmark.png') }}" alt="Domain Huntress — Public-Domain Adaptation Scout">
    <a class="status-link" href="{{ url_for('status') }}">Pipeline status →</a>
  </div>

  <div class="media-band">
    <video autoplay muted loop playsinline poster="{{ url_for('static', filename='logo.png') }}">
      <source src="{{ url_for('static', filename='logo-animation-textless.mp4') }}" type="video/mp4">
    </video>

    <div class="hero-bottom">
      <a class="cta-btn" href="{{ url_for('producers') }}">
        <span class="cta-title">I'm a Producer</span>
        <span class="cta-sub">Check if a book is public domain</span>
      </a>
      <a class="cta-btn red" href="{{ url_for('networks') }}">
        <span class="cta-title">I'm a Network</span>
        <span class="cta-sub">Find PD books for your mandate</span>
      </a>
    </div>
  </div>

</div>

</body>
</html>
