<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- These only take effect once added to the iOS home screen and launched
     from that icon -- Safari's URL bar can't be hidden while browsing a
     normal link in a tab, no meta tag overrides that. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domain Huntress">
<meta name="theme-color" content="#0d6b7a">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<title>Domain Huntress</title>
<style>
  :root {
    --teal: #0d6b7a;
    --gold: #e8b93f;
    --red: #d8482f;
    --cream: #faf6ec;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--teal);
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 14px 14px;
  }

  /* Single-screen budget, deliberately: logo (fixed), character art
     (flexible, fills whatever's left), buttons (fixed -- now that the
     button PNGs are cropped to their real ~3.3:1 pill shape instead of
     the padded 1536x1024 canvas they came in as, 3 of them plus a logo
     comfortably leave real room for the art instead of crushing it. */
  .page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 18px max(10px, env(safe-area-inset-bottom)) 18px;
  }

  .logo-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 6px;
  }
  .wordmark {
    max-width: min(260px, 62vw);
    width: 100%;
    height: auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
  }
  .status-link {
    position: absolute;
    top: 2px;
    right: 0;
    font-size: 10px;
    color: var(--cream);
    text-decoration: none;
    white-space: nowrap;
    background: rgba(0,0,0,0.25);
    padding: 4px 9px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.4);
  }

  /* Character art fills whatever vertical space is left after the logo
     and buttons take theirs -- deliberately cropped (object-fit:cover)
     to match the reference mockup's contained framing, rather than
     showing the full natural video frame. */
  .art-row {
    flex: 1 1 auto;
    min-height: max(230px, 30vh);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  .art-row video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
  }

  .button-col {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-top: 8px;
  }
  .cta-btn {
    display: block;
    line-height: 0;
    transition: transform 0.15s ease;
  }
  .cta-btn:hover { transform: translate(-2px, -3px); }
  .cta-btn img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div class="page">

  <div class="logo-row">
    <img class="wordmark" src="{{ url_for('static', filename='logo-wordmark.png') }}" alt="Domain Huntress — Public-Domain Adaptation Scout">
    <a class="status-link" href="{{ url_for('status') }}">Status →</a>
  </div>

  <div class="art-row">
    <video autoplay muted loop playsinline poster="{{ url_for('static', filename='poster-archer.png') }}">
      <source src="{{ url_for('static', filename='logo-animation-textless.mp4') }}" type="video/mp4">
    </video>
  </div>

  <div class="button-col">
    <a class="cta-btn" href="{{ url_for('producers') }}">
      <img src="{{ url_for('static', filename='btn-producer.png') }}" alt="I'm a Producer — check if a book is public domain">
    </a>
    <a class="cta-btn" href="{{ url_for('networks') }}">
      <img src="{{ url_for('static', filename='btn-network.png') }}" alt="I'm a Network — find PD books for your mandate">
    </a>
    <a class="cta-btn" href="{{ url_for('forward_looking') }}">
      <img src="{{ url_for('static', filename='btn-forward.png') }}" alt="Looking Forward 5 Years — what enters public domain next">
    </a>
  </div>

</div>

</body>
</html>
