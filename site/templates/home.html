<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- These only take effect once added to the iOS home screen and launched
     from that icon -- Safari's URL bar can't be hidden while browsing a
     normal link in a tab, no meta tag overrides that. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domain Huntress">
<meta name="theme-color" content="#0d6b7a">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<title>Domain Huntress</title>
<style>
  :root {
    --teal: #0d6b7a;
    --gold: #e8b93f;
    --red: #d8482f;
    --cream: #faf6ec;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--teal);
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 14px 14px;
  }

  /* Simple stacked document flow -- logo, then character art, then
     buttons -- deliberately NOT forced into a fixed viewport height.
     A rigid single-screen layout kept fighting the actual size of the
     asset images and either crushing or clipping content; letting the
     page be exactly as tall as its content needs and scroll if
     necessary is far more robust than re-tuning flex/height tricks
     against images whose proportions we don't fully control. */
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
  }

  .logo-row {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding-bottom: 6px;
  }
  .wordmark {
    /* Percentage width on a flex item (with no explicit flex-basis) can
       fail to resolve correctly and fall back toward intrinsic size --
       use a vw-based cap instead, which resolves against the viewport,
       not the ambiguous flex container. */
    max-width: min(320px, 74vw);
    width: 100%;
    height: auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
  }
  .status-link {
    position: absolute;
    top: 4px;
    right: 0;
    font-size: 10px;
    color: var(--cream);
    text-decoration: none;
    white-space: nowrap;
    background: rgba(0,0,0,0.25);
    padding: 5px 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.4);
  }

  /* Character art at its natural aspect ratio -- always fully visible,
     nothing cropped, regardless of where the animation is in its loop. */
  .art-row {
    width: 100%;
    line-height: 0;
    text-align: center;
  }
  .art-row video {
    width: 100%;
    max-width: 380px;
    height: auto;
    display: inline-block;
  }

  .button-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 12px;
    max-width: 380px;
    margin: 0 auto;
  }
  .cta-btn {
    display: block;
    line-height: 0;
    transition: transform 0.15s ease;
  }
  .cta-btn:hover { transform: translate(-2px, -3px); }
  .cta-btn img {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

<div class="page">

  <div class="logo-row">
    <img class="wordmark" src="{{ url_for('static', filename='logo-wordmark.png') }}" alt="Domain Huntress — Public-Domain Adaptation Scout">
    <a class="status-link" href="{{ url_for('status') }}">Status →</a>
  </div>

  <div class="art-row">
    <video autoplay muted loop playsinline poster="{{ url_for('static', filename='poster-archer.png') }}">
      <source src="{{ url_for('static', filename='logo-animation-textless.mp4') }}" type="video/mp4">
    </video>
  </div>

  <div class="button-col">
    <a class="cta-btn" href="{{ url_for('producers') }}">
      <img src="{{ url_for('static', filename='btn-producer.png') }}" alt="I'm a Producer — check if a book is public domain">
    </a>
    <a class="cta-btn" href="{{ url_for('networks') }}">
      <img src="{{ url_for('static', filename='btn-network.png') }}" alt="I'm a Network — find PD books for your mandate">
    </a>
    <a class="cta-btn" href="{{ url_for('forward_looking') }}">
      <img src="{{ url_for('static', filename='btn-forward.png') }}" alt="Looking Forward 5 Years — what enters public domain next">
    </a>
  </div>

</div>

</body>
</html>
