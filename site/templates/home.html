<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domain Huntress">
<meta name="theme-color" content="#0d6b7a">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<title>Domain Huntress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d6b7a url("{{ url_for('static', filename='bg-portrait.jpg') }}") center / cover no-repeat;
    overflow: hidden;
  }
  @media (min-width: 701px) {
    body { background-image: url("{{ url_for('static', filename='bg-landscape.jpg') }}"); }
  }

  /* Full-bleed video -- the whole screen IS the artwork, edge to edge,
     no separate boxed-off section. Logo and buttons float on top of it
     as transparent-PNG overlays instead of living in their own bands. */
  .hero { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
  .hero video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 35%;
  }
  /* object-fit:contain on <video> is unreliable on iOS Safari specifically
     (confirmed: correct and cropping-free in a Chromium engine at the same
     viewport width, but still cropped on a real iPhone even after a hard
     refresh) -- rather than keep fighting a WebKit-specific quirk, drop the
     object-fit approach for mobile entirely. The video goes back to normal
     document flow at its own natural size (width 100%, height auto), which
     cannot crop in any browser since there's no fit/crop math involved at
     all -- the tradeoff is losing the true full-bleed edge-to-edge look on
     mobile in favor of the video's whole frame always being visible. */
  @media (max-width: 700px) {
    html, body { height: auto; overflow-y: auto; }
    .hero { height: auto; overflow: visible; }
    .hero video { position: static; width: 100%; height: auto; display: block; }
  }

  .logo-overlay {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 0; right: 0;
    display: flex; justify-content: center;
    z-index: 2;
  }
  .wordmark {
    max-width: min(230px, 56vw);
    width: 100%; height: auto;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }
  .status-link {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: 10px;
    z-index: 3;
    font-size: 10px;
    color: #faf6ec;
    text-decoration: none;
    background: rgba(0,0,0,0.35);
    padding: 4px 9px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .hood-link {
    position: absolute;
    top: max(38px, calc(env(safe-area-inset-top) + 26px));
    right: 10px;
    z-index: 3;
    font-size: 8.5px;
    color: rgba(250,246,236,0.8);
    text-decoration: none;
    background: rgba(0,0,0,0.25);
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .button-overlay {
    position: absolute;
    bottom: max(10px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 5px;
    padding: 0 16px;
    z-index: 2;
  }
  .cta-btn { display: block; line-height: 0; transition: transform 0.15s ease; width: 50%; max-width: 190px; }
  .cta-btn:hover { transform: translate(-2px, -3px); }
  .cta-btn img { width: 100%; height: auto; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4)); }

  /* Desktop-only: a scannable QR code so a class watching on a projector
     can pull the same site up on their own phone. Hidden on mobile --
     no point showing someone on their phone a QR code to their own page. */
  .qr-panel {
    display: none;
    position: absolute;
    left: 16px; bottom: 16px;
    z-index: 3;
    width: 132px;
    background: #faf6ec;
    border: 3px solid #1a1a1a;
    border-radius: 12px;
    padding: 12px 12px 10px 12px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    text-align: center;
  }
  .qr-panel img { display: block; width: 100%; height: auto; }
  .qr-panel span {
    display: block; margin-top: 8px; padding: 0 2px; font-size: 9.5px; font-weight: 800;
    line-height: 1.35; text-transform: uppercase; letter-spacing: 0.03em; color: #1a1a1a;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (min-width: 701px) {
    .qr-panel { display: block; }
  }
</style>
</head>
<body>

<div class="hero">
  <video id="hero-video" autoplay muted loop playsinline preload="auto"
         poster="{{ url_for('static', filename='poster-archer.png') }}"
         data-poster-desktop="{{ url_for('static', filename='poster-archer-desktop.png') }}">
    <source src="{{ url_for('static', filename='logo-animation-desktop.mp4') }}" type="video/mp4" media="(min-width: 701px)">
    <source src="{{ url_for('static', filename='logo-animation-textless.mp4') }}" type="video/mp4">
  </video>
  <script>
    // poster-archer.png is a portrait mobile crop; on a wide viewport,
    // object-fit:cover stretches it into a tight, zoomed-in crop until the
    // video itself takes over. Swap to a proper widescreen poster frame
    // (pulled from the desktop video itself) before that first paint, so
    // any autoplay delay never shows the mobile crop on a wide screen.
    (function () {
      var v = document.getElementById('hero-video');
      if (v && window.matchMedia('(min-width: 701px)').matches) {
        v.poster = v.dataset.posterDesktop;
      }
    })();
  </script>

  <div class="logo-overlay">
    <img class="wordmark" src="{{ url_for('static', filename='logo-wordmark.png') }}" alt="Domain Huntress — Public-Domain Adaptation Scout">
  </div>
  <a class="status-link" href="{{ url_for('status') }}">Status →</a>
  <a class="hood-link" href="{{ url_for('under_the_hood') }}">Under the hood →</a>

  <div class="qr-panel">
    <img src="{{ url_for('static', filename='qr-code.png') }}" alt="Scan to open Domain Huntress on your phone">
    <span>Scan to launch on phone</span>
  </div>

  <div class="button-overlay">
    <a class="cta-btn" href="{{ url_for('producers') }}">
      <img src="{{ url_for('static', filename='btn-producer.png') }}" alt="I'm a Producer — check if a book is public domain">
    </a>
    <a class="cta-btn" href="{{ url_for('networks') }}">
      <img src="{{ url_for('static', filename='btn-network.png') }}" alt="I'm a Network — find PD books for your mandate">
    </a>
    <a class="cta-btn" href="{{ url_for('forward_looking') }}">
      <img src="{{ url_for('static', filename='btn-forward.png') }}" alt="Looking Forward 5 Years — what enters public domain next">
    </a>
  </div>
</div>

<script>
  // The autoplay/muted/playsinline attributes are usually enough on their
  // own, but iOS Safari specifically leaves the video paused (poster frame
  // showing, no visible controls) after two situations those attributes
  // don't cover: restoring the page from the back-forward cache (tapping
  // "back" into this page) and the tab/app regaining foreground after being
  // backgrounded. Both leave .play() as the only way to resume, so retry it
  // on the events that fire for each case. .catch() is required -- some
  // browsers reject the promise if autoplay is genuinely blocked (e.g. iOS
  // Low Power Mode), and that's expected, not an error to surface.
  (function () {
    var video = document.getElementById('hero-video');
    if (!video) return;
    function tryPlay() { video.play().catch(function () {}); }
    tryPlay();
    window.addEventListener('pageshow', tryPlay);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) tryPlay();
    });
  })();
</script>
</body>
</html>
