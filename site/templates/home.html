<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Huntress</title>
<style>
  :root {
    --teal: #0d6b7a;
    --gold: #e8b93f;
    --red: #d8482f;
    --cream: #faf6ec;
    --ink: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--teal);
    overflow: hidden;
  }
  .hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .hero video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }
  .hero-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding: 30px 20px;
    z-index: 2;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
  }
  .hero-top img {
    max-width: 260px;
    width: 55%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .logo-placeholder {
    color: var(--cream);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.03em;
    text-shadow: 0 3px 8px rgba(0,0,0,0.6);
    text-transform: uppercase;
  }
  .status-link {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 3;
    font-size: 11px;
    color: var(--cream);
    text-decoration: none;
    background: rgba(0,0,0,0.35);
    padding: 6px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .hero-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 30px 20px 44px 20px;
    z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
  }
  .cta-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--ink);
    background: var(--gold);
    border: 4px solid var(--ink);
    border-radius: 16px;
    padding: 18px 30px;
    min-width: 230px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-align: center;
  }
  .cta-btn:hover {
    transform: translate(-2px, -4px);
    box-shadow: 8px 10px 0 rgba(0,0,0,0.4);
  }
  .cta-btn.red {
    background: var(--red);
    color: var(--cream);
  }
  .cta-btn .cta-title {
    font-size: 17px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cta-btn .cta-sub {
    font-size: 12px;
    margin-top: 5px;
    font-weight: 500;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="hero">
  <video autoplay muted loop playsinline poster="{{ url_for('static', filename='logo.png') }}">
    <source src="{{ url_for('static', filename='logo-animation-textless.mp4') }}" type="video/mp4">
  </video>

  <a class="status-link" href="{{ url_for('status') }}">Pipeline status →</a>

  <div class="hero-top">
    <!-- Placeholder until the new logo file lands -- swap the div below for
         an <img src="{{ url_for('static', filename='logo.png') }}"> once it does -->
    <div class="logo-placeholder">Domain Huntress</div>
  </div>

  <div class="hero-bottom">
    <a class="cta-btn" href="{{ url_for('producers') }}">
      <span class="cta-title">I'm a Producer</span>
      <span class="cta-sub">Check if a book is public domain</span>
    </a>
    <a class="cta-btn red" href="{{ url_for('networks') }}">
      <span class="cta-title">I'm a Network</span>
      <span class="cta-sub">Find PD books for your mandate</span>
    </a>
  </div>
</div>

</body>
</html>
